name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace -PallowUnverifiedRelease=true

      - name: ktlint
        run: ./gradlew ktlintCheck

  rules:
    name: Mechanical rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run rule checks
        run: ./gradlew checkRules --stacktrace

  device-matrix:
    name: Launch on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: ['26', '37.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == '26' && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/launch-check.sh ${{ matrix.api-level }}

  instrumented-compile:
    name: Compile instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile androidTest sources
        run: >-
          ./gradlew
          :app:compileDebugAndroidTestKotlin
          :data:compileDebugAndroidTestKotlin
          :ui:compileDebugAndroidTestKotlin
          --stacktrace

  instrumented:
    name: Instrumented tests on API 37
    needs: instrumented-compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest :data:connectedDebugAndroidTest :ui:connectedDebugAndroidTest --continue --stacktrace

      - name: Annotate failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).iter('testcase'):
                  for k in tc:
                      if k.tag in ('failure', 'error'):
                          msg = (k.get('message') or k.text or '')[:300].replace('\n', ' ')
                          print(f"::error::{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: ktlint
        run: ./gradlew ktlintCheck

  rules:
    name: Mechanical rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run rule checks
        run: ./gradlew checkRules --stacktrace

  device-matrix:
    name: Launch on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 37]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == 26 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.maxeydev.picklejot/.MainActivity
            sleep 5
            # AC-1.19 — "it installed" is not "it launched". Assert the process is
            # actually alive after start, so a crash-on-launch fails the job.
            adb shell pidof com.maxeydev.picklejot
            # And assert nothing crashed into the log on the way up.
            if adb logcat -d -b crash | grep -q "com.maxeydev.picklejot"; then
              echo "::error::App crashed on launch (API ${{ matrix.api-level }})"
              adb logcat -d -b crash | tail -50
              exit 1
            fi

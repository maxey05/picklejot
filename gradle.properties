org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.daemon.idletimeout=1200000
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP does not support AGP 9's built-in Kotlin compilation (google/ksp#2615), and Room's
# annotation processor runs on KSP. Built-in Kotlin is therefore OFF and org.jetbrains.kotlin.android
# is applied explicitly in :app, :data and :ui. Removing this line silently disables Room codegen.
# AGP 10 removes this opt-out entirely — revisit when KSP ships built-in-Kotlin support.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Purchase verifier (server/). Public values; see server/README.md. Release builds refuse blank/malformed values unless -PallowUnverifiedRelease=true.
licenseServerUrl=
licenseServerPublicKey=
